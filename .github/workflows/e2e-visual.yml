name: E2E Visual Baselines

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the baselines on THIS runner and upload them as an artifact'
        type: boolean
        default: false
  schedule:
    - cron: '30 4 * * *'

# Least-privilege default for GITHUB_TOKEN (CodeQL actions hardening).
permissions:
  contents: read

jobs:
  e2e-visual:
    name: "E2E Visual Baselines (Apache + MariaDB, non-blocking)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start WordPress environment
        run: bash bin/wp-env-up.sh .wp-env.e2e.json

      - name: Assert pinned WordPress beta version
        env:
          WP_ENV_CONFIG_PATH: .wp-env.e2e.json
          WP_ENV_ASSERT_CONTAINERS: cli
        run: npm run env:assert-wp-version

      # These baselines are ONLY ever asserted here, on Linux. Regenerating them on a
      # developer laptop produces PNGs that can never match — macOS font metrics differ
      # by a few pixels, which is enough because `threshold` is a per-pixel colour
      # tolerance, not a pixel-count budget. That is how VISN-01..04 came to fail every
      # nightly run while this job still reported success. Dispatch this workflow with
      # update_snapshots=true, download the `visual-snapshots` artifact, and commit it.
      - name: Regenerate baselines on this runner
        if: ${{ inputs.update_snapshots }}
        env:
          WP_ENV_CONFIG_PATH: .wp-env.e2e.json
        run: npm run test:e2e:visual -- --update-snapshots

      # !cancelled(), not success(): a regeneration run FAILS if any test cannot be
      # updated at all (VISN-03/04 time out rather than mismatch), and the snapshots
      # that did regenerate are exactly what is needed to fix the rest.
      - name: Upload regenerated baselines
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/e2e/specs/visual/__snapshots__/
          retention-days: 7

      # Not continue-on-error. Snapshot drift genuinely is not a runtime-compatibility
      # failure — the rationale release-confidence.yml records — but swallowing the
      # exit code made this job report "success" over four failing baselines on every
      # nightly run for as long as anyone checked, which is indistinguishable from not
      # running it. This workflow is scheduled and not a required check, so a red run
      # blocks nobody; it is simply the signal that someone needs to look.
      - name: Run visual baseline tests
        id: visual
        if: ${{ !inputs.update_snapshots }}
        env:
          WP_ENV_CONFIG_PATH: .wp-env.e2e.json
        run: npm run test:e2e:visual

      - name: Upload visual artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            tests/e2e/artifacts/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report visual drift
        if: ${{ steps.visual.conclusion == 'failure' }}
        run: |
          echo "Visual baseline drift detected (non-blocking workflow)."
          echo "Review uploaded artifacts and update snapshots intentionally if needed."

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop --config .wp-env.e2e.json
