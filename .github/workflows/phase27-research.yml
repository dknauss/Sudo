name: Phase 27 Research Evidence

on:
  push:
    branches: [main]
    paths:
      - '.planning/phases/27-threat-and-trusted-flow/**'
      - 'tests/e2e/research/**'
      - 'tests/e2e/fixtures/phase27-*'
      - 'tests/e2e/phase27.wp-env.json'
      - 'tests/e2e/research*.playwright.config.ts'
      - 'bin/run-phase27-*.mjs'
      - 'bin/phase27-https-proxy.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase27-research.yml'
  pull_request:
    branches: [main]
    paths:
      - '.planning/phases/27-threat-and-trusted-flow/**'
      - 'tests/e2e/research/**'
      - 'tests/e2e/fixtures/phase27-*'
      - 'tests/e2e/phase27.wp-env.json'
      - 'tests/e2e/research*.playwright.config.ts'
      - 'bin/run-phase27-*.mjs'
      - 'bin/phase27-https-proxy.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase27-research.yml'
  workflow_dispatch:

concurrency:
  group: phase27-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase27-node-baseline:
    name: Phase 27 Node baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run clean browser baseline
        run: npm run test:research:phase27:node
      - name: Upload Node evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase27-node-baseline-${{ github.sha }}
          path: tests/e2e/artifacts/research-test-results/
          if-no-files-found: ignore
          retention-days: 14

  phase27-node-mutations:
    name: Phase 27 Node mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install npm dependencies
        run: npm ci
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete guard manifest
        run: npm run test:research:phase27:mutations
      - name: Upload mutation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase27-node-mutations-${{ github.sha }}
          path: tests/e2e/artifacts/research-test-results/
          if-no-files-found: ignore
          retention-days: 14

  phase27-wp-integration:
    name: Phase 27 WordPress integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: &wordpress-steps
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Patch wp-env for Composer audit compatibility
        run: node bin/patch-wp-env.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run WordPress/PHP baseline and mutation manifest
        run: npm run test:research:phase27:wordpress
      - name: Upload WordPress evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase27-wp-${{ github.job }}-${{ github.sha }}
          path: tests/e2e/artifacts/phase27-wordpress-results/
          if-no-files-found: ignore
          retention-days: 14

  # These two jobs reuse the anchor above and therefore run the IDENTICAL
  # command. They are repetitions, not distinct lanes: the runner takes no lane
  # selector, so nothing here makes browser transport or concurrency separately
  # visible. Repetition buys flake detection on the wp-env provisioning path and
  # nothing else — do not read the job names as separate coverage. Splitting
  # them for real needs a lane selector in bin/run-phase27-wordpress.mjs (#490).
  phase27-wp-browser:
    name: Phase 27 WordPress browser transport
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: *wordpress-steps

  phase27-wp-concurrency:
    name: Phase 27 WordPress concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: *wordpress-steps

  phase27-evidence-audit:
    name: Phase 27 evidence audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install npm dependencies
        run: npm ci
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify research manifests and local dependency roots
        env:
          PHASE27_REQUIRE_CLEAN: '1'
        run: |
          set -euo pipefail
          test ! -L node_modules
          test ! -L vendor
          php -r '$m = require "vendor/composer/autoload_classmap.php"; $expected = realpath(getcwd() . "/includes/class-gate.php"); $actual = realpath($m["WP_Sudo\\Gate"] ?? ""); exit($actual === $expected ? 0 : 1);'
          node bin/run-phase27-guard-ids.mjs
          node -e 'const fs=require("fs"); for (const file of ["tests/e2e/research/phase27-guard-manifest.json","tests/e2e/research/phase27-wordpress-guard-manifest.json"]) { const data=JSON.parse(fs.readFileSync(file,"utf8")); if (!Array.isArray(data.guards) || data.guards.length===0) process.exit(1); }'
          test -z "$(git status --porcelain)"
