name: Documentation Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default for GITHUB_TOKEN (CodeQL actions hardening).
permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run docs-lint regression harness
        run: bash tests/docs-lint/run.sh
        shell: bash

      - name: Check for stale fixed-date references and old count patterns
        run: bash bin/docs-lint.sh
        shell: bash
