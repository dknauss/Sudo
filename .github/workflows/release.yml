name: Release

# Manually builds a clean demonstrator ZIP from an existing v* tag and publishes
# it as a GitHub prerelease. A tag push alone never publishes a release: the
# maintainer must separately decide that the snapshot materially supports the
# conceptual project or an upstream WordPress core proposal.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish as a Research Preview
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify release input and plugin version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::Release tag must begin with v"; exit 1 ;;
          esac
          git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"
          VERSION="${RELEASE_TAG#v}"
          HEADER_VERSION="$(grep -m1 -E '^\s*\*\s*Version:' wp-sudo.php | sed -E 's/.*Version:[[:space:]]*//')"
          echo "tag=$VERSION header=$HEADER_VERSION"
          test "$VERSION" = "$HEADER_VERSION"

      - name: Build install ZIP (reuses the Plugin Check dist builder)
        run: |
          bash bin/build-plugin-check-dist.sh build/wp-sudo
          ( cd build && zip -rq wp-sudo.zip wp-sudo )
          unzip -tq build/wp-sudo.zip

      - name: Create GitHub Release + attach ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: WP Sudo ${{ inputs.tag }} — Research Preview
          body: |
            > **Research prototype only. Do not install this release on production,
            > public staging, or any site containing real users, credentials, or
            > data. Use it only in WordPress Playground or a disposable local test
            > environment. This prerelease is a reproducible research snapshot, not
            > a production security control.**

            Read the canonical project boundary in `PROJECT-STATUS.md`.
          prerelease: true
          make_latest: false
          files: build/wp-sudo.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
